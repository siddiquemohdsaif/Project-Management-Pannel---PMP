<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/pmp_web_icon.png?v=1" />
    <meta name="description" content="Project Management Panel live project Gantt chart." />
    <title>Gantt Chart - Project Management Panel</title>
    <script src="./js/auth-guard.js"></script>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/gantt.css?v=pmp-20260820-5" />
  </head>
  <body class="gantt-page">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
        <div class="brand"><div class="brand-logo-frame"><img src="./assets/pmp-logo.png" alt="PMP - Project Management Panel" /></div><button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close navigation">&times;</button></div>
        <nav class="primary-nav">
          <button class="nav-item" type="button" data-route="/dashboard"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-7h5v7"/></svg><span>Dashboard</span></button>
          <button class="nav-item" type="button" data-screen="Projects"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v2h4v-2"/></svg><span>Projects</span></button>
          <button class="nav-item" type="button" data-screen="Tasks"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m7.5 12 3 3 6.5-7"/></svg><span>Tasks</span></button>
          <button class="nav-item active" type="button" aria-current="page"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4v16M4 7h6M8 12h12M4 17h10"/><circle cx="4" cy="7" r="1"/><circle cx="4" cy="17" r="1"/></svg><span>Gantt Chart</span></button>
          <button class="nav-item" type="button" data-screen="Members"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="9" cy="7" r="4"/><path d="M16 4.2a4 4 0 0 1 0 7.6M22 20v-1.5a4 4 0 0 0-3-3.7"/></svg><span>Members</span></button>
          <button class="nav-item" type="button" data-screen="Reports"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 16v-3M12 16V8M17 16v-6"/></svg><span>Reports</span></button>
          <button class="nav-item" type="button" data-screen="Activity"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12h4l2.2-6 4.1 12 2.2-6H21"/></svg><span>Activity</span></button>
          <button class="nav-item" type="button" data-screen="Settings"><svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg><span>Settings</span></button>
        </nav>
        <button class="sidebar-profile" type="button" data-screen="Profiles"><span class="avatar avatar-small">JD</span><span class="profile-copy"><strong>John Doe</strong><small>john@example.com</small></span><span class="profile-arrow">&rsaquo;</span></button>
      </aside>
      <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

      <main class="main-content">
        <header class="topbar">
          <div class="project-heading">
            <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Open navigation"><span></span><span></span><span></span></button>
            <span class="project-identity-mark" id="activeProjectMark" aria-hidden="true"><svg class="project-people" id="activeProjectIconFallback" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3.5 20v-2a4.5 4.5 0 0 1 4.5-4.5h2a4.5 4.5 0 0 1 4.5 4.5v2M16 8a3 3 0 0 1 0 5.8M17 20v-1.5a4.5 4.5 0 0 0-2.3-3.9"/></svg><img class="active-project-icon" id="activeProjectIcon" alt="" hidden /><i></i></span>
            <div class="project-menu-wrap">
              <button class="project-selector" id="projectSelector" type="button" aria-expanded="false"><span class="project-selector-copy"><small>Active project</small><span id="selectedProject">Loading projects</span></span><span class="chevron"></span></button>
              <div class="dropdown project-dropdown" id="projectDropdown" hidden><span class="dropdown-label">Switch project</span></div>
            </div>
          </div>
          <div class="gantt-header-meta"><span id="scheduleHealth"><i></i><b>Checking schedule</b></span><button class="top-avatar" type="button" data-screen="Profiles" aria-label="Open profile">JD</button></div>
        </header>

        <section class="gantt-page-content" aria-labelledby="ganttTitle">
          <h1 class="sr-only" id="ganttTitle">Project Gantt chart</h1>
          <div class="gantt-toolbar">
            <div class="project-tabs" role="tablist" aria-label="Project views"><button class="tab" type="button" data-route="/dashboard">Overview</button><button class="tab" type="button" data-screen="Tasks">Tasks</button><button class="tab active" type="button" aria-selected="true">Gantt</button><button class="tab" type="button" data-screen="Members">Members</button><button class="tab" type="button" data-screen="Activity">Activity</button></div>
            <div class="gantt-actions">
              <div class="filter-wrap"><button class="gantt-control" id="filterButton" type="button" aria-expanded="false"><span class="filter-icon"></span>Filters<span class="filter-count">6</span></button><div class="gantt-popover filter-popover" id="filterPopover" hidden><strong>Show task status</strong><label><input type="checkbox" data-filter-status="completed" checked /> Completed</label><label><input type="checkbox" data-filter-status="progress" checked /> In progress</label><label><input type="checkbox" data-filter-status="partial" checked /> Partially completed</label><label><input type="checkbox" data-filter-status="blocked" checked /> Blocked</label><label><input type="checkbox" data-filter-status="not-started" checked /> Not started</label><label class="overdue-filter"><input type="checkbox" data-filter-overdue checked /> Show overdue warning</label><button type="button" id="applyFilters">Apply filters</button></div></div>
              <div class="zoom-control" aria-label="Timeline zoom"><span>Zoom</span><button id="zoomOut" type="button" aria-label="Zoom out">&minus;</button><button id="zoomIn" type="button" aria-label="Zoom in">+</button></div>
              <button class="gantt-control icon-only" id="ganttSettings" type="button" aria-label="Toggle compact rows"><span class="gear-icon"></span></button>
            </div>
          </div>

          <div class="gantt-summary-strip" aria-live="polite"><span><b id="workingDays">0</b> working days</span><span><b id="mainTaskCount">0</b> main tasks</span><span><b id="subtaskCount">0</b> subtasks</span><span><b id="dependencyCount">0</b> dependencies</span><small id="scheduleRange">No scheduled dates</small></div>
          <div class="gantt-frame" id="ganttFrame">
            <section class="task-pane" aria-label="Task hierarchy"><header><span>Task Name</span><small>Assignees</small></header><div id="taskRows"></div></section>
            <section class="timeline-scroll" id="timelineScroll" aria-label="Project schedule timeline"><div class="timeline" id="timeline"><header class="month-row" id="monthRow"></header><div class="days-row" id="daysRow"></div><div class="timeline-body" id="timelineBody"><div class="dependency-layer" id="dependencyLayer" aria-hidden="true"></div></div></div></section>
          </div>
          <div class="gantt-state" id="ganttState" role="status" aria-live="polite" hidden></div>
          <footer class="gantt-footer" aria-label="Gantt chart legend"><span><i class="legend-line completed"></i>Completed</span><span><i class="legend-line in-progress"></i>In progress</span><span><i class="legend-line partial"></i>Partially completed</span><span><i class="legend-line blocked"></i>Blocked</span><span><i class="legend-line not-started"></i>Not started</span><span><i class="legend-overdue"></i>Overdue</span><span><i class="legend-dependency"></i>Dependency</span><small>Hover or focus a scheduled bar for details</small></footer>
        </section>
      </main>
    </div>
    <div class="task-tooltip" id="taskTooltip" role="tooltip" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./js/gantt.js?v=pmp-20260820-5"></script>
  </body>
</html>
