<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to Project Management Panel with Google."
    />
    <title>Sign In · Project Management Panel</title>
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body class="login-page">
    <main class="login-shell" aria-labelledby="loginTitle">
      <section class="login-card">
        <div class="login-copy">
          <a class="login-mark" href="/" aria-label="Project Management Panel home">
            <img src="./assets/pmp-logob.png" alt="PMP" />
          </a>

          <div class="login-heading">
            <h1 id="loginTitle">Project Management <span>Panel</span></h1>
            <p>Plan, manage, and deliver great software products together.</p>
          </div>

          <button class="google-login-button" id="googleLoginButton" type="button">
            <span class="google-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path fill="#4285f4" d="M22.6 12.2c0-.8-.1-1.6-.2-2.4H12v4.5h5.9a5 5 0 0 1-2.2 3.3v2.8h3.6c2.1-1.9 3.3-4.8 3.3-8.2Z" />
                <path fill="#34a853" d="M12 23c3 0 5.5-1 7.3-2.6l-3.6-2.8c-1 .7-2.2 1-3.7 1-2.8 0-5.2-1.9-6.1-4.5H2.2V17A11 11 0 0 0 12 23Z" />
                <path fill="#fbbc05" d="M5.9 14.1a6.6 6.6 0 0 1 0-4.2V7H2.2a11 11 0 0 0 0 10l3.7-2.9Z" />
                <path fill="#ea4335" d="M12 5.4c1.6 0 3.1.6 4.3 1.7l3.1-3.1A10.5 10.5 0 0 0 12 1 11 11 0 0 0 2.2 7l3.7 2.9c.9-2.6 3.3-4.5 6.1-4.5Z" />
              </svg>
            </span>
            <span>Sign in with Google</span>
          </button>
          <p class="login-status" id="loginStatus" role="status" hidden></p>

          <p class="login-terms">
            By continuing, you agree to our
            <a href="#" aria-label="Read Terms of Service">Terms of Service</a>
            and
            <a href="#" aria-label="Read Privacy Policy">Privacy Policy</a>.
          </p>
        </div>

        <div class="login-art" aria-hidden="true">
          <img src="./assets/index_page_icon.png" alt="" />
        </div>
      </section>
    </main>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
